# Python FastAPI Microservice Base URL Configuration
python.service.url=http://localhost:8000

# Global DB Persistence Toggle for Empirical Test Isolation
app.db.save.enabled=true

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:transactiondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true